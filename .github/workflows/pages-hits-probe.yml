name: Pages traffic probe (throwaway)
# Temporary: verifies whether GitHub records real Pages hits/pageviews for this
# site (GET /repos/.../pages with the workflow token). Reports via issue comment
# (admin-free to read). Delete this file once read.
on:
  push:
    branches: [main]
    paths: [".github/workflows/pages-hits-probe.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages") || code=curl_error
          {
            echo "HTTP $code"
            echo '```json'
            head -c 3500 pages.json
            echo
            echo '```'
            echo 'pageviews: '"$(jq -c '.pageviews // "none"' pages.json 2>/dev/null)"
            echo 'hits_summary: '"$(jq -c 'if .hits then {n:(.hits|length), newest:(.hits[-1].date // "n/a"), last5:[.hits[-5:][]|{d:.date,h:.hits}]} else "NO HITS FIELD" end' pages.json 2>/dev/null)"
          } > report.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "pages-probe-result" --body-file report.md
