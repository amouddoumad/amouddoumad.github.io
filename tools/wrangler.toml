# Cloudflare Worker: mad-arrivals visit counter (see ingest-worker.js, HANDOFF §10).
# CLI path (needs Node):  cd tools && npx wrangler deploy
#                        npx wrangler secret put SALT      (then paste a random string)
#                        npx wrangler secret put STATS_KEY (random string → dashboard URL ?key=)
# Dashboard path needs no Node at all (paste + bindings + secrets by hand).
name = "mad-arrivals-analytics"
main = "ingest-worker.js"
compatibility_date = "2026-09-01"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "madarrivals"

[vars]
ACCOUNT_ID = "a44b92587fcd74d0fd29ec7af18fc54e"
DATASET = "madarrivals"
# secret AE_RO_TOKEN (API token with Analytics:Read only) is also required for
# /stats to work — the production Worker binding has no query() method, so the
# Worker calls the Analytics Engine SQL API over HTTPS with this token:
#   npx wrangler secret put AE_RO_TOKEN   (paste the token value)
